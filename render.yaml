# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web services have an ephemeral disk, so local data resets on restart.
# Keep data by connecting Google Drive from the Storage card (see README → Storage),
# or switch plan to starter and uncomment the disk and DATA_DIR blocks.
services:
  - type: web
    name: hunter-memory
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Next.js compiles with TypeScript and Tailwind, which live in devDependencies.
      # Render sets NODE_ENV=production, which would otherwise skip those packages.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Google Drive storage (OAuth client from Google Cloud Console).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Optional: LinkedIn / Naukri / Indeed listings via JSearch (RapidAPI).
      - key: RAPIDAPI_KEY
        sync: false
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
